[project]
name = "qlora-qwen-empathy"
version = "0.1.0"
description = "QLoRA SFT Tone Alignment menggunakan data synthetic untuk Qwen"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch~=2.14.0",
    "transformers~=5.15.0",
    "accelerate~=1.15.0",
    "peft~=0.21.0",
    "trl~=1.14.1",
    "datasets~=5.0.0",
    "bitsandbytes>=0.50.0; sys_platform != 'darwin'",
]

[dependency-groups]
dev = [
    "pytest~=8.3.5",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
